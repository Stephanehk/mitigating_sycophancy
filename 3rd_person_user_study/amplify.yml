# AWS Amplify build spec for the THIRD-PERSON preference study.
#
# THIS FILE IS NOT READ BY AMPLIFY. Paste the `version:`-onwards block into the
# new app's console, under App settings -> Build settings -> Edit. It lives here
# so the spec is version-controlled and reviewable, and so the two apps' specs
# sit next to the code they build.
#
# WHY NOT MONOREPO MODE. Amplify's monorepo support does NOT look for an
# amplify.yml inside the app root -- it reads the REPO-ROOT amplify.yml and
# requires it to be an `applications:` list, one entry per app:
#
#     !!! CustomerError: Monorepo spec provided without "applications" key
#
# Converting the root file to that form would mean setting
# AMPLIFY_MONOREPO_APP_ROOT on the EXISTING study/ app too -- a console change
# and a redeploy of a live instrument, to gain nothing this app needs. A console
# build spec overrides the repo's amplify.yml outright, so the study/ app keeps
# reading the root file exactly as it does today and is not touched at all.
#
# So, in the new app's console:
#   - App settings -> Build settings -> Edit: paste the block below.
#   - App settings -> Environment variables:
#         PREF_SUPABASE_URL        https://<project-ref>.supabase.co
#         PREF_SUPABASE_ANON_KEY   the PUBLIC anon / sb_publishable_ key
#   - DO NOT set AMPLIFY_MONOREPO_APP_ROOT. That is what produced the error
#     above; with a console spec there is no app root for Amplify to resolve,
#     and the paths below are relative to the repo root instead.
#
# NEVER set a service_role key here. tools/build_static.py refuses a value that
# looks like a secret, so a slip fails the build rather than shipping a
# privileged credential in page source.
#
# THE BUILD STEP IS NOT OPTIONAL. static/config.json (Supabase URL, anon key,
# the pacing floors, the Prolific completion code) and static/consent.json
# (imported from study/content.py) are gitignored and generated here. A deploy
# without them serves a page that loads and then fails on its first call.
#
# No pip install: build_static.py and everything it imports are stdlib-only,
# which tests/test_generators.py pins.
#
# NO REWRITE RULES ARE NEEDED. The eight recruitment links are hash fragments --
# /#set_1 through /#set_8 -- which never reach the server. That is why they are
# hashes and not paths: /set_3 would need a rewrite to index.html, and Amplify's
# rewrites live in the console rather than in a file, so a fresh app would 404
# on every link.

version: 1
frontend:
  phases:
    build:
      commands:
        - python3 --version
        - python3 3rd_person_user_study/tools/build_static.py
  artifacts:
    # Only static/ is served. The Python modules stay in the repo as the source
    # of truth for the instrument and are never deployed -- which also keeps
    # data/items.json, the file that says which arm wrote which response, off
    # the site.
    baseDirectory: 3rd_person_user_study/static
    files:
      - '**/*'
  cache:
    paths: []

# config.json and consent.json are regenerated on every deploy and the page
# fetches them with cache: 'no-cache', but a CDN holding an old config.json
# would point live raters at the wrong project or an old completion code, so
# they are pinned to no-store. items.json changes only with the item set, and
# the digest check catches a stale one loudly rather than silently.
customHeaders:
  - pattern: '**/*.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0'
  - pattern: '**/*'
    headers:
      - key: Cache-Control
        value: 'no-cache'
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: same-origin
      - key: X-Frame-Options
        value: DENY
