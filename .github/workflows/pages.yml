# Publish the third-person preference study to GitHub Pages, at
#     https://<owner>.github.io/mitigating_sycophancy/3rd_person_user_study/static/
#
# IT PUBLISHES INTO A SUBDIRECTORY OF THE EXISTING gh-pages BRANCH, and does not
# touch anything else on it. That is the whole design constraint:
#
#   /mitigating_sycophancy/                          the results artifact page
#   /mitigating_sycophancy/3rd_person_user_study/    this study (redirect -> static/)
#
# Pages for this repo is configured as "deploy from branch: gh-pages", and the root
# of that branch is a live results page. So this workflow must NOT use
# actions/deploy-pages -- that switches the Pages source to "GitHub Actions" and
# whatever artifact it uploads becomes the WHOLE site, taking the results page
# down. It commits into gh-pages instead, which leaves the Pages setting alone.
#
# It also must not wipe the branch: only 3rd_person_user_study/ is replaced, and
# index.html / robots.txt / .nojekyll at the root are left exactly as they are.
#
# WHY THERE IS A BUILD STEP. static/config.json (the Supabase URL and anon key) is
# gitignored on main -- see 3rd_person_user_study/.gitignore -- so it does not
# exist in a fresh checkout and is generated here from repository secrets, the same
# arrangement amplify.yml uses for study/. It DOES end up committed on gh-pages,
# which is correct: the page fetches it at load, and everything on gh-pages is
# publicly served anyway.
#
# REQUIRED REPOSITORY SECRETS -- Settings -> Secrets and variables -> Actions:
#   PREF_SUPABASE_URL        https://<project-ref>.supabase.co
#   PREF_SUPABASE_ANON_KEY   the PUBLIC anon / sb_publishable_ key
#
# NEVER set the service_role key. tools/build_static.py refuses a value that looks
# like a secret, so a slip fails the build instead of shipping a privileged
# credential in page source.

name: Deploy preference study to Pages

on:
  push:
    branches: [main]
    # Only when the study or this workflow changes -- unrelated pushes to main
    # should not redeploy a live instrument.
    paths:
      - '3rd_person_user_study/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never let two deploys race: they both push to gh-pages.
concurrency:
  group: pages-3rd-person
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No pip install: build_static.py and everything it imports are stdlib only.
      # It rewrites static/items.json from the committed data/items.json (so a
      # stale published bundle cannot ship) and writes static/config.json.
      - name: Build the static bundle
        env:
          PREF_SUPABASE_URL: ${{ secrets.PREF_SUPABASE_URL }}
          PREF_SUPABASE_ANON_KEY: ${{ secrets.PREF_SUPABASE_ANON_KEY }}
        run: python 3rd_person_user_study/tools/build_static.py

      # The page and the database must agree on which item build is live. Fail the
      # deploy on a mismatch rather than publishing a page that would send every
      # rater into "item set mismatch" at the ID screen.
      - name: Check the published digest matches the pinned schema
        run: |
          python - <<'PY'
          import json, re, sys
          published = json.load(open("3rd_person_user_study/static/items.json"))
          schema = open("3rd_person_user_study/supabase_schema.sql").read()
          pinned = re.search(r"select '([0-9a-f]{64})'::text", schema)
          assert pinned, "no pinned digest in supabase_schema.sql"
          if published["items_sha256"] != pinned.group(1):
              sys.exit("digest mismatch: page %s, schema %s -- regenerate the "
                       "schema and re-apply it" % (published["items_sha256"][:12],
                                                   pinned.group(1)[:12]))
          print("%d items, digest %s" % (len(published["items"]),
                                         published["items_sha256"][:12]))
          PY

      - name: Publish into gh-pages/3rd_person_user_study
        run: |
          set -euo pipefail
          BUILD="$(mktemp -d)"
          cp -r 3rd_person_user_study/static "$BUILD/static"
          # The shorter /3rd_person_user_study/ link redirects to static/ rather
          # than 404ing.
          cat > "$BUILD/index.html" <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex, nofollow">
            <meta http-equiv="refresh" content="0; url=static/">
            <title>Response comparison</title>
          </head>
          <body><p><a href="static/">Continue to the study</a></p></body>
          </html>
          HTML

          git fetch origin gh-pages
          git worktree add ../ghp origin/gh-pages --detach
          # Replace ONLY this study's subtree. Everything else on the branch --
          # the results page at the root, robots.txt, .nojekyll -- is untouched.
          rm -rf ../ghp/3rd_person_user_study
          mkdir -p ../ghp/3rd_person_user_study
          cp -r "$BUILD"/. ../ghp/3rd_person_user_study/

          cd ../ghp
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 3rd_person_user_study
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "pages: publish 3rd_person_user_study from ${GITHUB_SHA::12}"
          git push origin HEAD:gh-pages
