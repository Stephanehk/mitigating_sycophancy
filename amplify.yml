# AWS Amplify build spec for the sycophancy user study.
#
# The study is a static site. There is no server, no Lambda and no API Gateway:
# the page talks straight to Supabase RPCs. Amplify's whole job is to serve
# study/static/ and to run one build step before it does.
#
# THAT BUILD STEP IS NOT OPTIONAL. static/config.json carries the Supabase URL
# and anon key and is gitignored, precisely so a key is never committed — so it
# does not exist in a fresh checkout and must be generated here. Without it the
# page loads and then fails on its first call. (static/content.json IS
# committed, but is regenerated too so a change to questionnaires.py cannot ship
# a stale bundle.)
#
# REQUIRED ENVIRONMENT VARIABLES — set these in the Amplify console under
# App settings -> Environment variables:
#
#   STUDY_SUPABASE_URL        https://<project-ref>.supabase.co
#   STUDY_SUPABASE_ANON_KEY   the PUBLIC anon / sb_publishable_ key
#
# NEVER set STUDY_SUPABASE_SERVICE_KEY here. It bypasses RLS, and anything the
# build can read can end up in the bundle. tools/build_static.py refuses to run
# if the value it is handed looks like a secret key, so a slip fails the build
# rather than shipping a privileged credential in page source.
#
# The build needs no pip install: build_static.py and everything it imports are
# stdlib-only.

version: 1
frontend:
  phases:
    build:
      commands:
        - python3 --version
        - python3 study/tools/build_static.py
  artifacts:
    # Only the static directory is served. The Python modules stay in the repo
    # as the source of truth for the instrument but are never deployed.
    baseDirectory: study/static
    files:
      - '**/*'
  cache:
    paths: []

# Cache policy. content.json and config.json are regenerated on every deploy and
# the SPA fetches them with cache: 'no-cache', but a CDN that had cached an old
# config.json would point live participants at the wrong project, so they are
# pinned to no-store. Everything else is small and changes together, so it is
# simpler to revalidate than to reason about a stale app.js against a fresh
# content.json.
customHeaders:
  - pattern: '**/*.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0'
  - pattern: '**/*'
    headers:
      - key: Cache-Control
        value: 'no-cache'
      # The page renders study-authored HTML from content.json and participant
      # text as textContent only (see widgets.js), and talks to exactly one
      # origin. Locking that down costs nothing here.
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: same-origin
      - key: X-Frame-Options
        value: DENY
