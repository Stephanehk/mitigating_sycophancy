# AWS Amplify build spec — THIS BRANCH DEPLOYS 3rd_person_user_study/.
#
# WHY A BRANCH. Amplify reads exactly one build spec: the repo-root amplify.yml,
# which takes PRECEDENCE over anything saved in an app's console build settings.
# Two apps out of one repo therefore need either a monorepo `applications:` list
# at the root -- which would mean setting AMPLIFY_MONOREPO_APP_ROOT on the LIVE
# study/ app and redeploying it -- or two branches with different roots. This is
# the second option, and it touches the first-person study not at all: `main`
# keeps its study/-only amplify.yml, its app keeps watching `main`, and nothing
# about it changes.
#
# THIS BRANCH IS FOR DEPLOYMENT ONLY. It is `main` plus this one file.
#
#   Bring it up to date:   git checkout pref-study-deploy
#                          git merge main            # conflicts ONLY on amplify.yml
#                          git checkout --ours amplify.yml && git add amplify.yml
#                          git commit && git push
#
#   NEVER merge this branch INTO main. It would replace main's spec with this
#   one and the first-person app would start deploying the wrong study.
#
# REQUIRED ENVIRONMENT VARIABLES, on the app watching this branch:
#
#   PREF_SUPABASE_URL        https://<project-ref>.supabase.co
#   PREF_SUPABASE_ANON_KEY   the PUBLIC anon / sb_publishable_ key
#
# Do NOT set AMPLIFY_MONOREPO_APP_ROOT. There is no monorepo spec here, and
# setting it produces "Monorepo spec provided without \"applications\" key".
#
# NEVER set a service_role key. tools/build_static.py refuses a value that looks
# like a secret, so a slip fails the build rather than shipping a privileged
# credential in page source.
#
# THE BUILD STEP IS NOT OPTIONAL. static/config.json (Supabase URL, anon key,
# the pacing floors, the Prolific completion code) and static/consent.json
# (imported from study/content.py, so the two studies cannot show differently
# worded consent) are gitignored and generated here. A deploy without them
# serves a page that loads and then fails on its first call.
#
# No pip install: build_static.py and everything it imports are stdlib-only,
# which tests/test_generators.py pins.
#
# NO REWRITE RULES ARE NEEDED. The eight recruitment links are hash fragments --
# /#set_1 through /#set_8 -- which never reach the server. That is why they are
# hashes and not paths: /set_3 would need a rewrite to index.html, and Amplify's
# rewrites live in the console rather than in this file, so a fresh app would
# 404 on every link.

version: 1
frontend:
  phases:
    build:
      commands:
        - python3 --version
        - python3 3rd_person_user_study/tools/build_static.py
  artifacts:
    # Only static/ is served. The Python modules stay in the repo as the source
    # of truth for the instrument and are never deployed -- which also keeps
    # data/items.json, the file that says which arm wrote which response, off
    # the site.
    baseDirectory: 3rd_person_user_study/static
    files:
      - '**/*'
  cache:
    paths: []

# config.json and consent.json are regenerated on every deploy and the page
# fetches them with cache: 'no-cache', but a CDN holding an old config.json
# would point live raters at the wrong project or an old completion code, so
# they are pinned to no-store.
customHeaders:
  - pattern: '**/*.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0'
  - pattern: '**/*'
    headers:
      - key: Cache-Control
        value: 'no-cache'
      - key: X-Content-Type-Options
        value: nosniff
      - key: Referrer-Policy
        value: same-origin
      - key: X-Frame-Options
        value: DENY
